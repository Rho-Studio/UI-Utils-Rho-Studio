name: Android Release Rho.Studio®

on:
  workflow_dispatch:
  push:
    branches: [ "pre-release-v103" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Release Rho.Studio®
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.1.0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.5.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Add this step here
      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $GOOGLE_SERVICES_JSON | base64 --decode > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: List APK directory
        run: ls -la app/build/outputs/apk/debug/

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RhoStudioUI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Rho-Studio-UI
          path: app/build/outputs/apk/debug/RhoStudioUI.apk

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: "**/build/reports/tests/"
