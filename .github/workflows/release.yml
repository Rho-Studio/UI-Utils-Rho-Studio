name: Android Release Rho.Studio®

on:
  workflow_dispatch:
  push:
    branches: [ "Pre-release-v102" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Release Rho.Studio®
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.1.0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.5.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # Debug: list the APK directory to see what was produced
      - name: List APK directory
        run: |
          echo "Contents of app/build/outputs/apk/debug:"
          ls -la app/build/outputs/apk/debug/ || echo "Directory not found"

      # Rename the APK (handle different possible names)
      - name: Rename APK
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          # Find any .apk file (ignore if multiple, but take the first)
          APK_FILE=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            mv -v "$APK_FILE" "$APK_DIR/RhoStudioUI.apk"
          else
            echo "No APK found!" && exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Rho-Studio-UI
          path: app/build/outputs/apk/debug/RhoStudioUI.apk

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: "**/build/reports/tests/"
